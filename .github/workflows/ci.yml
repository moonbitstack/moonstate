name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README, the skill and the guide into a
      # project, so they have to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

      - name: the pages match the sources
        if: runner.os == 'Linux'
        run: |
          python3 scripts/gen_api.py --check
          python3 scripts/gen_guide.py --check
          python3 scripts/gen_numbers.py --check

  vectors:
    name: differential vectors match the reference
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install the reference
        run: pip install "langgraph==1.2.20"

      - name: regenerate and compare
        run: python scripts/gen_vectors.py --check

  crash:
    name: a killed run continues from its checkpoint
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: kill the durable example mid-run and restart it
        run: bash scripts/kill_test.sh

  backends:
    name: the same checkpoint scenarios on four backends
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: moonstate
          POSTGRES_DB: moonstate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: moonstate
          MYSQL_DATABASE: moonstate
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmoonstate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      # SQLite, PostgreSQL and MySQL run the same scenarios as the in-memory
      # saver, and the transcripts have to match line for line.
      - name: the four backends answer alike
        working-directory: integration
        env:
          MOONSTATE_LIVE: "1"
          PGPORT: "5432"
          PGPASSWORD: moonstate
          PGDATABASE: moonstate
          MYSQL_TCP_PORT: "3306"
          MYSQL_PWD: moonstate
          MYSQL_DATABASE: moonstate
        run: |
          moon run src --target native | tee "$RUNNER_TEMP/backends.txt"
          grep -q "every backend answers alike" "$RUNNER_TEMP/backends.txt"

  semantic-conventions:
    name: the spans follow the semantic conventions
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      # The release CDN answers 504 often enough that a single curl is a coin
      # toss; the API path is a second route to the same file.
      - name: install weaver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="weaver-x86_64-unknown-linux-gnu.tar.xz"
          url="https://github.com/open-telemetry/weaver/releases/download/v0.28.0/$asset"
          if ! curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              -o "$RUNNER_TEMP/weaver.tar.xz" "$url"; then
            gh release download v0.28.0 -R open-telemetry/weaver -p "$asset" \
              -D "$RUNNER_TEMP" --clobber
            mv "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/weaver.tar.xz"
          fi
          tar -xf "$RUNNER_TEMP/weaver.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/weaver-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: the registry accepts the telemetry
        run: bash scripts/weaver_live_check.sh
